<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir contrato - LegalLens AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px">
    <h1 class="h3 mb-4">Subir contrato</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de contrato</label>
                    <select name="tipo" class="form-select">
                        <option value="alquiler">Contrato de Alquiler</option>
                        <option value="nda">Acuerdo de Confidencialidad (NDA)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Archivo PDF</label>
                    <input type="file" name="archivo" class="form-control" accept=".pdf" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Analizar contrato</button>
                </div>
            </form>
        </div>
    </div>
    <a href="{% url 'dashboard' %}" class="btn btn-link mt-3">Volver al dashboard</a>
</div>
<script>
document.querySelector("form").addEventListener("submit", function() {
    document.querySelector("button[type=submit]").innerHTML = "Analizando...";
    document.querySelector("button[type=submit]").disabled = true;
});
</script>
</body>
</html>
