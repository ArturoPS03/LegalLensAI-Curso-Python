services:

  db-legal:
    image: postgres:16
    environment:
      POSTGRES_DB: legallens_db
      POSTGRES_USER: legallens_user
      POSTGRES_PASSWORD: legallens_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legallens_net

  backend-django:
    build: ./backend
    command: >
      sh -c "while ! nc -z db-legal 5432; do echo 'Esperando PostgreSQL...'; sleep 1; done &&
                  python manage.py migrate &&
                  python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/app:z
    environment:
      DATABASE_URL: postgresql://legallens_user:legallens_pass@db-legal:5432/legallens_db
      AI_ENGINE_URL: http://ai-engine:8000
    depends_on:
      - db-legal
    networks:
      - legallens_net

  ai-engine:
    build: ./ai_engine
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ai_engine:/app:z
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    networks:
      - legallens_net

  nginx-proxy:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports:
      - "80:80"
    depends_on:
      - backend-django
      - ai-engine
    networks:
      - legallens_net

volumes:
  postgres_data:

networks:
  legallens_net:
